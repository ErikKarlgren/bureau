[package]
name = "bureau"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "color", "error-context", "help", "suggestions", "usage", "wrap_help", "derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
sanitise-file-name = { version = "1.0.0", default-features = false, features = ["std"] }

# Originally copied from https://www.namtao.com/rust/, thanks to No Boilerplate
# for sharing it!
[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
